name: Bootstrap source tree

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct audited release
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* | base64 --decode > /tmp/m-edit.zip
          expected="131202fd5a7e1ce70ce865888b25fc4316ff4c0a1d9d60611360b45f4bcfa389"
          actual="$(sha256sum /tmp/m-edit.zip | awk '{print $1}')"
          test "$actual" = "$expected"
          rm -rf /tmp/m-edit-release
          mkdir -p /tmp/m-edit-release
          unzip -q /tmp/m-edit.zip -d /tmp/m-edit-release
          source_dir="$(find /tmp/m-edit-release -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$source_dir"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$source_dir"/. .
          chmod +x bin/m-edit install.sh uninstall.sh scripts/*.py evals/*.py shared/scripts/*.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release m-edit v1.0.0-rc.1"
          git push origin main
