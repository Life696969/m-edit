name: Publish uploaded m-edit release

on:
  push:
    branches: [main]
    paths:
      - 'm-edit*.zip'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and publish source tree
        shell: bash
        run: |
          set -euo pipefail

          archive="$(find . -maxdepth 1 -type f -name 'm-edit*.zip' -print -quit)"
          test -n "$archive"

          expected="131202fd5a7e1ce70ce865888b25fc4316ff4c0a1d9d60611360b45f4bcfa389"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual" = "$expected"

          rm -rf /tmp/m-edit-release
          mkdir -p /tmp/m-edit-release
          unzip -q "$archive" -d /tmp/m-edit-release
          source_dir="$(find /tmp/m-edit-release -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$source_dir"
          test -f "$source_dir/README.md"
          test -f "$source_dir/skills/m-edit/SKILL.md"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$source_dir"/. .
          chmod +x bin/m-edit install.sh uninstall.sh scripts/*.py evals/*.py shared/scripts/*.py 2>/dev/null || true

          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 shared/scripts/release_audit.py --root .
          python3 scripts/validate_skills.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release m-edit v1.0.0-rc.1"
          git tag -f v1.0.0-rc.1
          git push origin main
          git push --force origin v1.0.0-rc.1
